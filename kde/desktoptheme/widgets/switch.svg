    <path class="ColorScheme-Text" fill="currentColor" opacity="0.1" d="M 23,0 A 9,9 0 0 1 32,9 9,9 0 0 1 23,18 V 17 A 8,8 0 0 0 31,9 8,8 0 0 0 23,1 Z"/>
  </g>

