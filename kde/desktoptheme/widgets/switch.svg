    <path class="ColorScheme-Text" fill="currentColor" opacity="0.1" d="M 9,0 A 9,9 0 0 0 0,9 9,9 0 0 0 9,18 V 17 A 8,8 0 0 1 1,9 8,8 0 0 1 9,1 Z"/>
  </g>
