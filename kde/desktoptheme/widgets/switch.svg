        }
        .ColorScheme-ButtonBackground {
            color:#2a2c33;
        }
    </style>
  </defs>

  <rect id="hint-bar-size" x="0" y="0" width="34" height="18" fill="none" stroke="none" opacity="0"/>

  <g id="inactive-left">
