    <rect class="ColorScheme-Text" fill="currentColor" opacity="0.1" x="9" y="0" width="14" height="1"/><rect class="ColorScheme-Text" fill="currentColor" opacity="0.1" x="9" y="17" width="14" height="1"/>
  </g>
  <g id="active-right" transform="translate(0,22)">
